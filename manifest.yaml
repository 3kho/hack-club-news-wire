display_information:
  name: Hack Club News Wire
  description: Submit and review stories for the Hack Club News Wire
  background_color: "#ec3750"
features:
  bot_user:
    display_name: Hack Club News Wire
    always_online: false
  slash_commands:
    - command: /news-wire
      description: Submit a story to the Hack Club News Wire
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
settings:
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
